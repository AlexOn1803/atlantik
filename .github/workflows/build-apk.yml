name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Тести ядра
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Збірка APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Перейменувати APK
        run: cp app/build/outputs/apk/release/app-release.apk AtlanticHeater.apk

      - name: Реліз з APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Atlantic Обігрівач (збірка ${{ github.run_number }})
          body: APK для встановлення на Android. Збірка з коміту ${{ github.sha }}.
          files: AtlanticHeater.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: AtlanticHeater-apk
          path: app/build/outputs/apk/release/*.apk
